<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.16.0/dist/maplibre-gl.css">
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.16.0/dist/maplibre-gl.mjs">
    <style>
        html, body, #map {
            margin: 0;
            width: 100%;
            height: 480px
        }
    </style>
</head>
<body>
<div id="map"></div>
<script type="module">
    import {App} from "https://cdn.jsdelivr.net/npm/@modelcontextprotocol/ext-apps@2.0.4/dist/src/app-with-deps.js";
    const url = document.querySelector('link[rel="modulepreload"]')?.href;
    const maplibregl = await import(url);
    // Hosts allow blob workers and block external worker origins. Register a
    // local Blob URL that imports the worker module through script-src.
    const workerText = await fetch(url.replace(/maplibre-gl\.mjs$/, "maplibre-gl-worker.mjs")).then(response => response.text());
    const workerBlob = new Blob([workerText], { type: "text/javascript" });
    maplibregl.setWorkerUrl(URL.createObjectURL(workerBlob));

    const app = new App({name: "Traccar", version: "1.0.0"});
    let map;
    app.ontoolresult = async ({structuredContent}) => {
        map?.remove();
        map = new maplibregl.Map({
            container: 'map',
            style: structuredContent.style || 'https://tiles.openfreemap.org/styles/liberty',
            bounds: structuredContent.bounds
        })
        map.addControl(new maplibregl.NavigationControl());
        map.once("load", () => {
            for (const layer of structuredContent.layers || []) {
                const source = {type: "geojson", data: layer.data};
                map.addSource(layer.id, source);
                map.addLayer({...layer, source: layer.id});
            }
        });
        for (const marker of structuredContent.markers || []) {
            const element = document.createElement("div");
            element.className = `marker marker-${marker.style || "pin"}`;
            if (marker.style === "numbered") element.textContent = marker.label || "";
            const m = new maplibregl.Marker({element, color: marker.color})
                .setLngLat(marker.coordinates)
                .addTo(map);
            if (marker.popup) m.setPopup(new maplibregl.Popup().setText(marker.popup));
        }
    }
    app.onhostcontextchanged = () => {
        document.getElementById('map').style.height = app.getHostContext()?.displayMode === "fullscreen" ? "100vh" : "480px";
        map?.resize()
    };
    await app.connect();
</script>
</body>
</html>
